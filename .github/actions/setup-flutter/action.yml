name: Setup Flutter
description: Install Flutter, cache pub deps, write .env, run pub get.
inputs:
  supabase-url:
    description: Supabase URL
    required: true
  supabase-anon-key:
    description: Supabase anon key
    required: true
  maptiler-api-key:
    description: MapTiler API key
    required: true
  flutter-version:
    description: >-
      Flutter version to install. Defaults to the version pinned below, which
      must match the toolchain recorded in CLAUDE.md. Pass a value only to
      deliberately test a different version; pass '' to float to channel latest
      (not recommended — see the comment on the default).
    required: false
    # PINNED ON PURPOSE. This used to be '', which made every workflow install
    # whatever `stable` happened to be that day. That is a landmine: a Flutter
    # release can red every PR with no change on our side. It fired on
    # 2026-09-03 — stable had moved 3.41.7 -> 3.47.2, which promoted
    # `unawaited_return_in_try_block` from info to warning, and `flutter analyze
    # --no-fatal-infos` does not suppress warnings, so an urgent Play-compliance
    # PR went red for a reason unrelated to its diff.
    #
    # Keep this equal to the Flutter version in CLAUDE.md's "Toolchain versions"
    # section, which is what the app is developed and tested against locally.
    # Upgrading Flutter is now a deliberate, reviewable change: bump both here
    # and in CLAUDE.md in the same PR, and let CI prove the new version builds.
    default: '3.41.7'
runs:
  using: composite
  steps:
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
    - name: Cache pub download dir
      uses: actions/cache@v4
      with:
        # Only cache the pub download dir. Do NOT cache .dart_tool/ —
        # it holds Flutter build state (including NativeAssetsManifest.json
        # entries for packages like `objective_c`), and restoring it
        # without the matching build/ outputs breaks the iOS embed step
        # with "native asset X not found in build/native_assets/ios/".
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-
    - name: Write .env
      shell: bash
      run: |
        cat > .env <<EOF
        SUPABASE_URL=${{ inputs.supabase-url }}
        SUPABASE_ANON_KEY=${{ inputs.supabase-anon-key }}
        MAPTILER_API_KEY=${{ inputs.maptiler-api-key }}
        EOF
    - name: flutter pub get
      shell: bash
      run: flutter pub get
