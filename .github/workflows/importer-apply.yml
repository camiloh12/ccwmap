name: Importer Apply (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which Supabase project to write to'
        required: true
        type: choice
        options:
          - staging
          - prod
      confirm:
        description: 'Type exactly: I-KNOW-THIS-WRITES-TO-STAGING or I-KNOW-THIS-WRITES-TO-PROD'
        required: true
        type: string
      sources:
        description: 'Comma-separated source names (default: all 7)'
        required: false
        type: string
        default: 'hifld_courts,gsa,hifld_military,nces,ipeds,faa,osm'
      states:
        description: 'Comma-separated USPS state codes'
        required: false
        type: string
        default: 'TX,FL,PA'
      delete_orphans:
        description: 'Delete pins whose source record is gone (capped per source; user-corrected pins are kept)'
        required: false
        type: boolean
        default: false
      orphan_delete_cap:
        description: "One-time per-source cap override, e.g. gsa=2700 (needs delete_orphans; use the dry-run's delete count)"
        required: false
        type: string
        default: ''

concurrency:
  group: importer-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply to ${{ inputs.target }}
    runs-on: ubuntu-latest
    env:
      IMPORTER_SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.target == 'prod' && secrets.PROD_SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    defaults:
      run:
        working-directory: importer
    steps:
      - name: Validate confirmation phrase
        # Runs before checkout, so override the job-level
        # `working-directory: importer` — that dir does not exist until checkout
        # populates it, and bash cannot start in a missing cwd. This step needs
        # no repo files (pure string comparison); the workspace root always exists.
        working-directory: ${{ github.workspace }}
        run: |
          expected="I-KNOW-THIS-WRITES-TO-$(echo '${{ inputs.target }}' | tr a-z A-Z)"
          if [ "${{ inputs.confirm }}" != "$expected" ]; then
            echo "::error::Confirmation phrase must be: $expected"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.x'

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --frozen

      - name: Apply to ${{ inputs.target }}
        env:
          DELETE_ORPHANS: ${{ inputs.delete_orphans }}
          ORPHAN_DELETE_CAP: ${{ inputs.orphan_delete_cap }}
        run: |
          # --delete-orphans is opt-in. The cap override is for a one-time
          # cleanup whose deletions a dry-run listed first; otherwise a
          # breach means stop and investigate.
          orphan_flags=()
          if [ "$DELETE_ORPHANS" = "true" ]; then orphan_flags+=(--delete-orphans); fi
          if [ -n "$ORPHAN_DELETE_CAP" ]; then
            if [ "$DELETE_ORPHANS" != "true" ]; then
              echo "::error::orphan_delete_cap needs delete_orphans"
              exit 1
            fi
            orphan_flags+=(--orphan-delete-cap "$ORPHAN_DELETE_CAP")
            echo "**Orphan delete cap override: $ORPHAN_DELETE_CAP**" >> "$GITHUB_STEP_SUMMARY"
          fi
          uv run --no-sync python -m importer.cli \
            --apply \
            --states "${{ inputs.states }}" \
            --sources "${{ inputs.sources }}" \
            --project-ref ${{ inputs.target }} \
            --i-know-this-writes-to-${{ inputs.target }} \
            "${orphan_flags[@]}" \
            --report-out "$GITHUB_WORKSPACE/importer-report.md"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: importer-apply-${{ inputs.target }}-${{ github.run_id }}
          path: |
            importer-report.md
            importer-report.json
          retention-days: 90
