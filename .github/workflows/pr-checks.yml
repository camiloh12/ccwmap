name: PR Checks

# Triggers on EVERY PR to master — no `paths-ignore`. GitHub leaves a required
# status check "Expected / waiting" forever when the workflow that produces it
# is skipped by a path filter, which permanently blocks the merge (this bit
# importer-only PRs). So the required Flutter jobs below always RUN and always
# REPORT: they do the real work only when app-facing files changed (detected by
# the `changes` job) and otherwise pass via a trivial skip step — no expensive
# Flutter/iOS build for importer/docs-only PRs.
on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `app` = anything the Flutter checks actually validate. Importer,
          # data, and docs changes match none of these -> app == 'false' ->
          # the Flutter jobs skip their work but still report success.
          filters: |
            app:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'android/**'
              - 'ios/**'
              # CI's own config counts as app-facing. setup-flutter decides
              # which Flutter version every job below installs, so a change
              # there can alter analyze/test/build results without touching a
              # line of app code — exactly the case you most want re-run.
              # Without this, a PR that edits only .github/ skips every Flutter
              # job and still reports green, which reads as "verified" when
              # nothing was built.
              - '.github/**'

  format:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.app != 'true'
        run: echo "No app-facing changes — skipping Flutter format check."
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.app == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          maptiler-api-key: ${{ secrets.MAPTILER_API_KEY }}
      - name: dart format check
        if: needs.changes.outputs.app == 'true'
        run: dart format --output=none --set-exit-if-changed .

  analyze-test:
    name: Analyze + Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.app != 'true'
        run: echo "No app-facing changes — skipping flutter analyze + test."
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.app == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          maptiler-api-key: ${{ secrets.MAPTILER_API_KEY }}
      - name: flutter analyze
        if: needs.changes.outputs.app == 'true'
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        if: needs.changes.outputs.app == 'true'
        run: flutter test

  build-android:
    name: Build Android (debug APK)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.app != 'true'
        run: echo "No app-facing changes — skipping Android build."
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.app == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: needs.changes.outputs.app == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          maptiler-api-key: ${{ secrets.MAPTILER_API_KEY }}
      - name: flutter build apk --debug
        if: needs.changes.outputs.app == 'true'
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (no codesign)
    needs: changes
    runs-on: macos-latest
    steps:
      - if: needs.changes.outputs.app != 'true'
        run: echo "No app-facing changes — skipping iOS build."
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.app == 'true'
        uses: ./.github/actions/setup-flutter
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          maptiler-api-key: ${{ secrets.MAPTILER_API_KEY }}
      - name: flutter build ios --release --no-codesign
        if: needs.changes.outputs.app == 'true'
        run: flutter build ios --release --no-codesign

  # Gitleaks runs on EVERY PR (secrets can land in any path, importer included).
  # This is the single always-on source of the required "Secret scan (gitleaks)"
  # context — the duplicate job was removed from importer-pr-validate.yml.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
